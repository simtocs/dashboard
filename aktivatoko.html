<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMTOCS - Data Aktiva Toko</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/aktivatoko.css">
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div class="logout-warning" id="logoutWarning">
        <div class="warning-content">
            <h3>⚠️ Peringatan Inaktivitas</h3>
            <p>Anda akan logout otomatis dalam <strong><span id="warningCountdown">60</span> detik</strong> karena tidak ada aktivitas.</p>
            <button onclick="resetInactivityTimer()">Saya Masih Di Sini</button>
        </div>
    </div>

    <div class="user-bar">
        <div class="user-info">
            <span>👤</span> <span class="user-name" id="displayUsername">Guest</span>
        </div>
        <div class="user-actions">
            <button onclick="window.location.href='index.html'" class="auth-btn">
                <span>🏠</span> Dashboard
            </button>
            <button id="authBtn" onclick="handleAuth()" class="auth-btn" style="display:none;">
                <span>🔐</span> <span id="authBtnText">Otentikasi</span>
            </button>
            <button onclick="logout()" class="logout-btn">
                <span>🚪</span> Logout
            </button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🏢 Data Aktiva Toko</h1>
            <p>Daftar Aset Tetap dan Inventaris Per Cabang</p>
        </div>

        <div class="aktiva-container">
            <div class="aktiva-card">
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="storeSelect">Pilih Cabang Toko:</label>
                        <select id="storeSelect" onchange="loadAktivaData()">
                            <option value="">-- Pilih Toko --</option>
                            <option value="F4SD">F4SD - SPBU Teras Ayung</option>
                            <option value="FKOM">FKOM - Komodo</option>
                            <option value="FHEN">FHEN - Hasanuddin</option>
                            <option value="FEHU">FEHU - Teuku Umar</option>
                            <option value="FIVI">FIVI - Imam Bonjol</option>
                            <option value="FZ7Y">FZ7Y - Sunset Road</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="aktivaContent">
                <div class="empty-state">
                    <span class="empty-icon">📊</span>
                    <h3>Pilih toko untuk menampilkan data aktiva</h3>
                    <p>Data akan dimuat langsung dari database Google Sheets.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/index.js"></script> <script src="js/aktivatoko.js"></script> </body>
</html>
