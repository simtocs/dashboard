<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMTOCS - Progress Perbaikan Toko</title>
    <link rel="stylesheet" href="css/surkas2025.css">
    <link rel="stylesheet" href="css/progressperbaikan.css">
</head>
<body>
    <div class="logout-warning" id="logoutWarning">
        <div class="warning-content">
            <h3>⚠️ Peringatan Inaktivitas</h3>
            <p>Anda akan logout otomatis dalam <strong><span id="warningCountdown">60</span> detik</strong> karena tidak ada aktivitas.</p>
            <button onclick="resetInactivityTimer()">Saya Masih Di Sini</button>
        </div>
    </div>

    <div class="user-bar">
        <div class="user-info"><span>👤</span><span id="displayUsername">Guest</span></div>
        <button onclick="logout()" class="logout-btn"><span>🚪</span><span>Logout</span></button>
    </div>

    <div class="container">
        <div class="header">
            <h1>🛠️ SIMTOCS - Progress Perbaikan Toko</h1>
            <p>Monitoring dan Rekapitulasi Pemeliharaan Fasilitas Toko Carang Sari</p>
        </div>

        <div class="controls">
            <a href="index.html" class="back-btn"><span>🏠</span><span>Kembali ke Dashboard</span></a>
            <div class="select-wrapper"><select id="fStore" onchange="applyFilter()"></select></div>
            <div class="select-wrapper">
                <select id="fUrg" onchange="applyFilter()">
                    <option value="">Semua Urgensi</option>
                    <option>High</option><option>Medium</option><option>Low</option>
                </select>
            </div>
            <div class="select-wrapper">
                <select id="fStat" onchange="applyFilter()">
                    <option value="">Semua Status</option>
                    <option>Attended</option><option>Unattended</option><option>Hold</option>
                </select>
            </div>
            <button class="add-btn" onclick="openModal()"><span>➕</span><span>Tambah Temuan</span></button>
            <button class="compare-btn" id="pdfBtn" onclick="exportPDF()"><span>📄</span><span>Unduh PDF</span></button>
        </div>

        <div class="content" id="content"></div>
    </div>

    <div id="dataModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tambah Temuan</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="dataForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="editId">
                <div class="form-group"><label for="mStore">Toko *</label><select id="mStore" required></select></div>
                <div class="form-group"><label for="mDesc">Deskripsi Masalah / Pekerjaan *</label><input type="text" id="mDesc" required placeholder="Contoh: Lampu chiller mati 3 pcs"></div>
                <div class="form-group"><label for="mUrg">Urgensi *</label>
                    <select id="mUrg" required><option>High</option><option selected>Medium</option><option>Low</option></select></div>
                <div class="form-group"><label for="mStat">Status *</label>
                    <select id="mStat" required><option>Attended</option><option>Unattended</option><option>Hold</option></select></div>
                <div class="form-group"><label for="mProg">Progres &amp; Tindak Lanjut</label><input type="text" id="mProg" placeholder="Contoh: Penyusunan owner estimate"></div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Simpan</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="js/progressperbaikan.js"></script>
</body>
</html>
